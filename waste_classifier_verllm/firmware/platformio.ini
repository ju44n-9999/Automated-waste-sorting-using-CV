[platformio]
src_dir = WasteClassifierVerLLM
default_envs = waste_s3_verllm

[env:waste_s3_verllm]
; Arduino core 3.2.1, matching the Arduino IDE setup in README.md.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 15728640
board_build.partitions = WasteClassifierVerLLM/partitions.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
    bblanchon/ArduinoJson@7.4.2
    https://downloads.arduino.cc/libraries/github.com/spaziochirale/Chirale_TensorFLowLite-2.0.0.zip
monitor_speed = 115200
upload_speed = 460800
